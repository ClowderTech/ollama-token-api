[package]
name = "ollama-token-api"
version = "0.1.0"
edition = "2024"

[dependencies]
warp = { version = "0.4.3", features = ["server"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
mongodb = "3.9.1"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
regex = "1.13.1"
tokio = { version = "1.53.3", features = ["full"] }
futures-util = "0.3.34"
bytes = "1.12.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
anyhow = "1.0.104"
async-stream = "0.3.6"
